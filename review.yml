aid: sana-benefits
name: Sana Benefits
review:
  question: Does Sana Benefits expose a public, self-serve developer portal or API?
  answer: false
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: United States
  tier: benefits-admin
  gated: true
findings:
  summary: |
    Sana Benefits publishes no public API surface of any kind. Every
    conventional developer-portal host and path was probed on 2026-07-25 and
    none exists: developer.sanabenefits.com, developers.sanabenefits.com,
    docs.sanabenefits.com and api.sanabenefits.com all fail to resolve (curl
    exit 000, no DNS), while /developers, /api, /developer, /partners and
    /integrations on www.sanabenefits.com all return HTTP 404. The full Yoast
    page sitemap (67 URLs) contains no developer, API, docs or integrations
    page — the site is a WordPress marketing property covering employers,
    brokers, providers, plans, guides, case studies and ten state landing
    pages, with nothing technical.

    The only machine-readable host is secure.sanabenefits.com, the member /
    employer / broker application. It answers HTTP 200 with
    application/json for the SPA shell (bundleName "LoginApp") and redirects
    unknown paths to /login. Probing it for specs returns an explicit auth
    wall: /openapi.json and /swagger.json both return HTTP 401 with
    {"error":{"message":"Login required","code":"login_required"}}, and
    /api/v1/openapi.json returns the same. This is an internal application
    API behind session login, not a developer product. Under the review
    criteria this is category (b), a partner/agent login wall, so gated is
    true and no developer portal URL is recorded as confirmed.

    No OpenAPI, Swagger, AsyncAPI, GraphQL SDL, .proto or Postman artifact
    was found, so the openapi/ directory is intentionally absent from this
    repo. /graphql on the secure host returns the login SPA shell rather
    than a GraphQL response, and no introspection was attempted against a
    gated endpoint. There is no GitHub organization: api.github.com/orgs
    returns 404 for both "sanabenefits" and "sana-benefits".
