  acord:
    posture: no ACORD reference found
    evidence: |
      A word-boundary scan for ACORD, AL3, ACORD XML, NGDS, IVANS, "agency
      download", Applied Epic, Vertafore and AMS360 across the homepage,
      /sana-partners/, /brokers/, /employers/, /what-we-do/, /broker-faq/,
      /employer-faqs/ and /healthcare-providers/ returned zero matches.
      Sana is a health-benefits carrier rather than a P&C carrier, so ACORD
      is not the native standard for its line of business — but the health
      equivalents are equally absent: no reference to X12 834 benefit
      enrollment, X12 837/835 claims, EDI, SFTP file exchange, HRIS or
      payroll integrations (Gusto, Rippling, Justworks), or SSO appears in
      any public page. The single "payroll" hit is an FAQ answer clarifying
      that Sana is not a PEO and does not take over payroll.
  insuranceVerbs:
    quote:
      exposedAsAPI: false
      note: quoting is a human broker workflow — /get-quote/ and /broker-get-quote/ web forms, with the broker page promising "Get rates in 48 hours. No medical questionnaires needed."
    bind:
      exposedAsAPI: false
      note: binding runs through the assigned broker and the Sana sales team; no programmatic surface
    issue:
      exposedAsAPI: false
      note: policy issuance and enrollment happen inside the login-walled employer dashboard at secure.sanabenefits.com
    fnol:
      exposedAsAPI: false
      note: no claims or FNOL API; claims are administered by Sana and surfaced to members in the portal and via the Sana Care care team
    audience: partner-only — broker-mediated distribution plus member/employer self-service inside an authenticated portal
  authModel:
    scheme: session login (email/password) to secure.sanabenefits.com
    publicOAuth: false
    oidcDiscovery:
      url: https://secure.sanabenefits.com/.well-known/openid-configuration
      status: '200'
      note: not OIDC metadata — the host returns the LoginApp JSON shell for this path
    oauthAuthorizationServer:
      url: https://secure.sanabenefits.com/.well-known/oauth-authorization-server
      status: '200'
      note: not OAuth metadata — the host returns the LoginApp JSON shell for this path
    apiKeys: false
    mtls: false
  webhooks:
    documented: false
    asyncapi: false
    note: no event catalog, webhook documentation or AsyncAPI artifact is published; absence is the finding
  postman:
    publicCollection: false
    publicWorkspace: false
  graphql:
    publicEndpoint: false
    note: https://secure.sanabenefits.com/graphql returns the login SPA shell; no public GraphQL surface, no SDL harvested
  grpc:
    publishedProtos: false
  sourceCode:
    githubOrganization: false
    note: api.github.com/orgs/sanabenefits and /orgs/sana-benefits both return HTTP 404
  transports:
    - protocol: HTTPS (web)
      documented: true
      note: WordPress marketing site at www.sanabenefits.com
    - protocol: REST/JSON (internal application API)
      scheme: https
      baseURL: https://secure.sanabenefits.com
      documented: false
      note: powers the member/employer/broker dashboards; returns 401 login_required to anonymous callers, undocumented publicly
    - protocol: GraphQL
      documented: false
    - protocol: WebSocket
      documented: false
    - protocol: gRPC
      documented: false
    - protocol: ACORD/AL3 or X12 EDI
      documented: false
      note: no standards-based exchange surface is described publicly
  marketContext: |
    The United States has no federal insurance regulator and no
    open-insurance mandate; insurance is regulated state by state under NAIC
    model laws, so nothing compels a carrier or benefits administrator to
    publish an API. Sana's posture is exactly what that seam predicts: value
    is delivered through brokers and an authenticated portal, and the
    technology story in its marketing ("technology-driven approach to
    benefits", "easy-to-use portal") is a UX claim rather than an
    integration claim. Recording the absence accurately is the finding.
